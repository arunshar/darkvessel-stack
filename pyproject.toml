[project]
name = "darkvessel"
version = "0.1.0"
description = "Multi-modal remote sensing stack for dark vessel detection"
authors = [{name = "Arun Sharma", email = "arunshar@umn.edu"}]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3",
  "torchvision>=0.18",
  "einops>=0.8",
  "numpy>=1.26",
  "scipy>=1.13",
  "rasterio>=1.3",
  "xarray>=2024.1",
  "stackstac>=0.5",
  "pystac-client>=0.7",
  "planetary-computer>=1.0",
  "hydra-core>=1.3",
  "omegaconf>=2.3",
  "transformers>=4.40",
  "huggingface_hub>=0.22",
  "diffusers>=0.27",
  "shapely>=2.0",
  "pyproj>=3.6",
  "geopandas>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.10"]
space = ["gradio>=4.30", "folium>=0.16", "branca>=0.7", "pillow>=10.0"]
xview3 = ["pandas>=2.0", "tqdm>=4.66"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
